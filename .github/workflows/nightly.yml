name: Starmap sync + deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      full_pass:
        type: boolean
        default: false
        description: "Force a full pass (re-walk every page, prune unstars now)"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      # Gate the deploy on the checks. This workflow publishes to Pages, so a
      # classification or graph regression should stop here rather than go live;
      # `npm run build` alone only type-checks `src`. See ci.yml for the PR-side
      # equivalent, which additionally runs the browser smoke test.
      - name: Lint
        run: npm run lint

      - name: Type-check src, pipeline, and tests
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Sync stars, classify, build data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without this input the only ways to force a full pass were editing
          # the YAML or waiting for Sunday (UTC).
          FORCE_FULL: ${{ inputs.full_pass && '1' || '' }}
        run: npm run sync

      - name: Build site
        run: npm run build

      - name: Commit classification cache and sync marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cache/classifications.json cache/positions.json LAST_SYNC
          git diff --cached --quiet || git commit -m "chore: nightly star sync"
          # actions/checkout leaves a detached HEAD, so push explicitly to the
          # branch that triggered this run rather than relying on an upstream.
          git push origin HEAD:${{ github.ref_name }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
